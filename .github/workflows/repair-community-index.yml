name: Repair CommunityIndex author attribution

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-approved-packages-publish
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    environment: community-release
    steps:
      - uses: actions/checkout@v4
      - name: Build trusted index signer
        shell: pwsh
        run: |
          cmake -S publisher -B build -A x64
          cmake --build build --config Release --target community-publisher
      - name: Regroup index by submission.github_user and sign
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMUNITY_INDEX_ED25519_PRIVATE_KEY: ${{ secrets.COMMUNITY_INDEX_ED25519_PRIVATE_KEY }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'WTCNUP-Author-Repair' }
          $brand = 'approved-packages'
          $rawHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github.raw'; 'User-Agent' = 'WTCNUP-Author-Repair' }
          $indexPath = Join-Path $env:RUNNER_TEMP 'CommunityIndex.before.json'
          $sigPath = Join-Path $env:RUNNER_TEMP 'CommunityIndex.sig'
          Invoke-WebRequest "https://api.github.com/repos/$env:REPO/contents/CommunityIndex.json?ref=$brand" -Headers $rawHeaders -OutFile $indexPath
          $index = Get-Content $indexPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $target = [ordered]@{}
          $userCache = @{}
          function Get-Author([string]$login, [string]$display) {
            if (-not $login) { $login = 'unknown' }
            $loginKey = $login.ToLowerInvariant()
            if (-not $target.Contains($loginKey)) {
              $uid = 0
              if (-not $userCache.ContainsKey($loginKey)) {
                try {
                  $u = Invoke-RestMethod "https://api.github.com/users/$login" -Headers $headers
                  $userCache[$loginKey] = $u
                } catch { $userCache[$login] = $null }
              }
              $u = $userCache[$loginKey]
              if ($u) { $uid = [int64]$u.id }
              $target[$loginKey] = [pscustomobject]@{
                author_id = $loginKey
                github_user_id = $uid
                github_login = $login
                display_name = if ($display) { $display } elseif ($u -and $u.name) { [string]$u.name } else { $login }
                projects = [ordered]@{}
              }
            } elseif ($display -and ($target[$loginKey].display_name -eq $target[$loginKey].github_login)) {
              $target[$loginKey].display_name = $display
            }
            return $target[$loginKey]
          }
          foreach ($author in @($index.authors)) {
            foreach ($project in @($author.projects)) {
              foreach ($version in @($project.versions)) {
                $login = [string]$author.author_id
                $display = [string]$author.display_name
                $uid = [string]$version.submission_uid
                if ($uid) {
                  try {
                    $metaUrl = "https://raw.githubusercontent.com/$env:REPO/main/submissions/$uid/submission.json"
                    $meta = Invoke-RestMethod $metaUrl -Headers @{ Accept = 'application/vnd.github.raw'; 'User-Agent' = 'WTCNUP-Author-Repair' }
                    if ($meta.github_user) { $login = [string]$meta.github_user }
                    if ($meta.author_name) { $display = [string]$meta.author_name }
                  } catch {}
                }
                $targetAuthor = Get-Author $login $display
                $projKey = [string]$project.project_id
                if (-not $targetAuthor.projects.Contains($projKey)) {
                  $targetAuthor.projects[$projKey] = [pscustomobject]@{
                    project_id = [string]$project.project_id
                    project_name = [string]$project.project_name
                    status = [string]$project.status
                    versions = @()
                  }
                }
                $targetAuthor.projects[$projKey].versions += $version
              }
            }
          }
          $newAuthors = @()
          foreach ($entry in $target.Values) {
            $projects = @()
            foreach ($project in $entry.projects.Values) { $projects += $project }
            $entry.projects = $projects
            $newAuthors += $entry
          }
          $index.authors = $newAuthors
          $index.index_version = [int]$index.index_version + 1
          $index.generated_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $index | ConvertTo-Json -Depth 30 -Compress | Set-Content -Encoding utf8 -NoNewline $indexPath
          & build/Release/community-publisher.exe sign-index --index $indexPath --out $sigPath --key-id 'community-index-2026-01'
          if ($LASTEXITCODE -ne 0) { throw 'sign failed' }
          function Blob([string]$path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $body = @{ content = [Convert]::ToBase64String($bytes); encoding = 'base64' } | ConvertTo-Json -Compress
            (Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/blobs" -Method Post -Headers $headers -ContentType 'application/json' -Body $body).sha
          }
          $ref = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/ref/heads/$brand" -Headers $headers
          $parent = $ref.object.sha
          $commitInfo = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/commits/$parent" -Headers $headers
          $treeBody = @{ base_tree = $commitInfo.tree.sha; tree = @(
            @{ path = 'CommunityIndex.json'; mode = '100644'; type = 'blob'; sha = (Blob $indexPath) },
            @{ path = 'CommunityIndex.sig'; mode = '100644'; type = 'blob'; sha = (Blob $sigPath) }
          ) } | ConvertTo-Json -Depth 8 -Compress
          $tree = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/trees" -Method Post -Headers $headers -ContentType 'application/json' -Body $treeBody
          $commit = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/commits" -Method Post -Headers $headers -ContentType 'application/json' -Body (@{ message = 'Repair CommunityIndex author attribution'; tree = $tree.sha; parents = @($parent) } | ConvertTo-Json -Compress)
          Invoke-RestMethod "https://api.github.com/repos/$env:REPO/git/refs/heads/$brand" -Method Patch -Headers $headers -ContentType 'application/json' -Body (@{ sha = $commit.sha; force = $false } | ConvertTo-Json -Compress) | Out-Null
          "INDEX_COMMIT=$($commit.sha)" >> $env:GITHUB_ENV
          @"
          ## Index author repair
          - commit: $($commit.sha)
          - authors: $($newAuthors.Count)
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
